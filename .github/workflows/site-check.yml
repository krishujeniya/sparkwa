name: Website static verification
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/verify-site.mjs'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/verify-site.mjs'
      - '.github/workflows/site-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax, routes and source assets
        run: node scripts/verify-site.mjs
